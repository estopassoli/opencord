packages:
  - apps/*
  - packages/*
# Somente estes pacotes podem executar scripts de instalação (binários nativos/engines).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  argon2: true
  esbuild: true
  '@swc/core': true
  electron: true
  '@livekit/rtc-node': true
