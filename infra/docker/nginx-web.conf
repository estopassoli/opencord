# Template do nginx (envsubst da imagem oficial troca ${APP_HOST}). TLS fica no proxy à frente.
server_tokens off;

# Imutável só o que tem hash do vite no nome (index-Do3mE4W3.js); o resto (landing: main.js, styles.css,
# assets/ sem hash) revalida, senão o navegador e a Cloudflare guardariam a versão antiga por um ano.
map $uri $oc_cache {
  "~*-[a-z0-9_]{8}\.(?:js|css|woff2|png|svg|ico)$" "public, max-age=31536000, immutable";
  default                                        "no-cache";
}

# Interface no navegador (SPA): rotas desconhecidas caem no index.html.
server {
  listen 80;
  server_name ${APP_HOST};
  root /usr/share/nginx/app;
  add_header Cache-Control $oc_cache always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
  # ninguém emoldura a interface (clickjacking); no <meta> do index.html o frame-ancestors é ignorado
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Frame-Options DENY always;
  location = /healthz { access_log off; return 200 "ok\n"; }
  # link de convite: vai para a página da API com o cartão (Open Graph: nome, imagem e membros do servidor, lido
  # por Discord/WhatsApp), que manda quem abre no navegador para /?invite=<código> (a SPA abre na raiz porque o
  # build usa caminhos relativos, por causa do Electron)
  location ~ "^/invite/([A-Za-z0-9]{10})/?$" { return 302 ${PUBLIC_API_URL}/invites/$1/embed; }
  location / { try_files $uri $uri/ /index.html; }
}

# Landing (qualquer outro host).
server {
  listen 80 default_server;
  root /usr/share/nginx/site;
  add_header Cache-Control $oc_cache always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  location = /healthz { access_log off; return 200 "ok\n"; }
  location / { try_files $uri $uri/ =404; }
}
