# OpenCord — stack self-hosted (dev/produção pequena). Copie infra/docker/.env.example para infra/docker/.env.
# Mídia WebRTC NÃO passa por proxy HTTP: LiveKit expõe TCP 7881 e UDP 50000-50100 diretamente; TURN via coturn.
name: opencord
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencord
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: opencord
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U opencord'], interval: 5s, retries: 20 }

  redis:
    image: redis:8
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, retries: 20 }

  livekit:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    command: ['--config', '/etc/livekit.yaml']
    volumes: ['./livekit.yaml:/etc/livekit.yaml:ro']
    ports:
      - '7880:7880'
      - '7881:7881/tcp'
      - '50000-50100:50000-50100/udp'

  coturn:
    image: coturn/coturn:4.7
    restart: unless-stopped
    network_mode: host
    volumes: ['../coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro']

  # Opcional: S3 local para testar STORAGE_DRIVER=s3 (S3_ENDPOINT=http://minio:9000, S3_FORCE_PATH_STYLE=true; ADR-0010).
  minio:
    profiles: ['s3']
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-opencord}
      # vazio = o MinIO recusa subir (exige >= 8 caracteres); só é lido com --profile s3
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes: [minio:/data]

  migrate:
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    command: ['npx', 'prisma', 'migrate', 'deploy', '--schema', '/app/prisma/schema.prisma']
    environment:
      DATABASE_URL: postgresql://opencord:${POSTGRES_PASSWORD}@postgres:5432/opencord
    depends_on: { postgres: { condition: service_healthy } }
    restart: 'no'

  api:
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://opencord:${POSTGRES_PASSWORD}@postgres:5432/opencord
      REDIS_URL: redis://redis:6379/0
      LIVEKIT_API_URL: http://livekit:7880
      STORAGE_LOCAL_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # Landing (site/) e interface no navegador (APP_HOST); o proxy com TLS fica à frente (ver docs/SELF_HOSTING.md).
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args: { VITE_OPENCORD_SERVER_URL: '${PUBLIC_API_URL:?defina PUBLIC_API_URL}' }
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?defina APP_HOST}
    ports: ['127.0.0.1:8080:80']

volumes:
  pgdata:
  uploads:
  minio:
