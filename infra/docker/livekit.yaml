# LiveKit (produção). Substitua as chaves (>= 32 caracteres) e o webhook. use_external_ip descobre o IP público via STUN.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
keys:
  CHANGE_ME_API_KEY: CHANGE_ME_SECRET_AT_LEAST_32_CHARACTERS_LONG
webhook:
  api_key: CHANGE_ME_API_KEY
  urls: ['http://api:3000/livekit/webhook']
room:
  empty_timeout: 60
  departure_timeout: 15
