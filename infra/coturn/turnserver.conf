# coturn (TURN/STUN) — credenciais temporárias via shared secret (use-auth-secret); troque static-auth-secret.
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_TURN_SECRET
realm=turn.exemplo.com
min-port=49160
max-port=49200
no-multicast-peers
no-cli
# Bloqueia relay para redes privadas (evita uso do TURN para alcançar a rede interna / SSRF).
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
# cert=/etc/ssl/turn/fullchain.pem
# pkey=/etc/ssl/turn/privkey.pem
