# LiveKit — desenvolvimento local (NÃO usar em produção: chaves de exemplo).
# API e LiveKit rodam no WSL; o desktop roda no Windows e alcança localhost:7880/7881 via encaminhamento TCP do WSL.
# O encaminhamento do WSL2 (modo NAT) não cobre UDP, então a mídia em dev usa ICE/TCP na porta 7881.
port: 7880
bind_addresses: ['127.0.0.1']
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
  node_ip: 127.0.0.1
keys:
  devkey: secret
webhook:
  api_key: devkey
  urls: ['http://127.0.0.1:3000/livekit/webhook']
room:
  empty_timeout: 60
  departure_timeout: 10
logging:
  level: info
