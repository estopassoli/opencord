name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: opencord
          POSTGRES_PASSWORD: opencord_ci
          POSTGRES_DB: opencord_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opencord" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://opencord:opencord_ci@127.0.0.1:5432/opencord_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/11
      LIVEKIT_VERSION: 1.13.10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run build typecheck lint test
      - name: LiveKit (binário oficial, checksum verificado)
        run: |
          mkdir -p .tools/livekit && cd .tools/livekit
          curl -sSLO https://github.com/livekit/livekit/releases/download/v$LIVEKIT_VERSION/livekit_${LIVEKIT_VERSION}_linux_amd64.tar.gz
          curl -sSLO https://github.com/livekit/livekit/releases/download/v$LIVEKIT_VERSION/checksums.txt
          grep linux_amd64 checksums.txt | sha256sum -c -
          tar xzf livekit_${LIVEKIT_VERSION}_linux_amd64.tar.gz
      - name: Testes de integração da API (Postgres/Redis/LiveKit reais)
        run: pnpm --filter @opencord/api test:integration

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter @opencord/desktop...
      - run: pnpm --filter @opencord/desktop test
      # Instalador NSIS sem assinatura (certificado ainda não definido pelo mantenedor).
      - name: Empacotar instalador (não assinado)
        working-directory: apps/desktop
        run: npx --yes electron-builder@26.17.0 --win --config electron-builder.yml --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencord-windows-unsigned
          path: apps/desktop/release/*.exe
          retention-days: 7

  # Sobe a stack do guia de self-hosting (infra/docker) do zero e confere API, migrações e web.
  self-host-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: infra/docker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: .env com segredos aleatórios
        run: |
          gen() { openssl rand -base64 48 | tr -d '/+=\n' | cut -c1-48; }
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(gen)|;s|^JWT_ACCESS_SECRET=.*|JWT_ACCESS_SECRET=$(gen)|;s|^ATTACHMENT_URL_SECRET=.*|ATTACHMENT_URL_SECRET=$(gen)|" .env
          LK_KEY="lk$(openssl rand -hex 8)"; LK_SECRET="$(gen)"
          sed -i "s|^LIVEKIT_API_KEY=.*|LIVEKIT_API_KEY=$LK_KEY|;s|^LIVEKIT_API_SECRET=.*|LIVEKIT_API_SECRET=$LK_SECRET|" .env
          sed -i "s|CHANGE_ME_API_KEY: CHANGE_ME_SECRET_AT_LEAST_32_CHARACTERS_LONG|$LK_KEY: $LK_SECRET|;s|api_key: CHANGE_ME_API_KEY|api_key: $LK_KEY|" livekit.yaml
      - name: Subir postgres, redis, livekit, migrate, api e web
        run: docker compose up -d --build --wait --wait-timeout 300 postgres redis livekit api web
      - name: Saúde
        run: |
          curl -fsS http://127.0.0.1:3000/health | tee /dev/stderr | grep -q '"database":"ok".*"livekit":"ok"'
          curl -fsS -H 'Host: app.exemplo.com' http://127.0.0.1:8080/ | grep -qi '<div id="root"'
          curl -fsS http://127.0.0.1:8080/ | grep -qi 'OpenCord'
          docker compose run --rm --no-deps -e OWNER_EMAIL=dono@exemplo.com -e OWNER_USERNAME=dono -e OWNER_PASSWORD="$(openssl rand -hex 16)" api node node_modules/@opencord/db/dist/create-owner.js
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200
