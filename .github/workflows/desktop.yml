# Instaladores do app desktop para Windows, macOS e Linux, cada um no próprio sistema (o .dmg só é gerado em macOS).
# Sem assinatura (Windows) / assinatura ad-hoc sem notarização (macOS) até haver certificados (ADR-0008).
#
# Automático (decisão do mantenedor, docs/DECISIONS.md): push no main que mexe no app gera uma versão nova e, se o
# secret DOWNLOADS_SSH_KEY existir, entrega os arquivos no volume de downloads do servidor por SSH restrito (rrsync
# só-escrita) e cria a release v<versão> no GitHub com os instaladores anexados e as novidades do changelog desde a
# release anterior (tags são criadas pela própria release; por isso o workflow não dispara em tags). O app instalado
# vê a versão nova e mostra "Atualização pronta". Tag vX.Y.Z usa exatamente essa versão; o disparo manual empacota
# sem publicar por padrão.
#
# Versão (SemVer, ADR-0063): a última tag de release + os commits do app desde ela (Conventional Commits): `feat` sobe
# o MINOR, `tipo!:`/`BREAKING CHANGE:` sobe o MAJOR, o resto sobe o PATCH (apps/desktop/scripts/next-version.mjs).
#
# App em Tauri (ADR-0062): com a variável do repositório TAURI_WINDOWS=1, o instalador do Windows é o do app em Tauri
# (job windows-tauri; macOS e Linux continuam no Electron). O atualizador do Electron instalado baixa esse instalador
# como uma versão nova; o instalador desinstala o Electron e o app novo importa a sessão (installer-hooks.nsh,
# migrate.rs).
name: Desktop (instaladores)
on:
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - apps/desktop-tauri/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml
  workflow_dispatch:
    inputs:
      server_url:
        description: Servidor embutido no app (VITE_OPENCORD_SERVER_URL)
        default: https://api.opencord.pro
      publish:
        description: Entregar no servidor (DOWNLOADS_SSH_*) ao final
        type: boolean
        default: false
      tauri:
        description: Windows pelo app em Tauri (teste do CI, sem ligar TAURI_WINDOWS; não publique)
        type: boolean
        default: false

permissions:
  contents: read

# um lançamento por vez; um push novo cancela a build anterior ainda em andamento
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # a versão sai da última tag de release e dos commits desde ela
          fetch-depth: 0
      - id: v
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            # SemVer pelos commits desde a última release (feat → minor, ! / BREAKING CHANGE → major, resto → patch)
            v=$(node apps/desktop/scripts/next-version.mjs)
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Versão do app: $v" >> "$GITHUB_STEP_SUMMARY"

  package:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # com o app em Tauri ligado, o Windows sai do job windows-tauri
        include: ${{ fromJSON((vars.TAURI_WINDOWS == '1' || inputs.tauri) && '[{"name":"mac","os":"macos-latest","flag":"--mac"},{"name":"linux","os":"ubuntu-latest","flag":"--linux"}]' || '[{"name":"windows","os":"windows-latest","flag":"--win"},{"name":"mac","os":"macos-latest","flag":"--mac"},{"name":"linux","os":"ubuntu-latest","flag":"--linux"}]') }}
    env:
      VITE_OPENCORD_SERVER_URL: ${{ inputs.server_url || vars.OPENCORD_SERVER_URL || 'https://api.opencord.pro' }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # vem do nome da tag: vai por variável de ambiente, nunca interpolado direto no script
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # histórico e tags: a versão de cada novidade vem das tags de release (changelog-versions.mjs)
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # é por essa versão que o app instalado detecta a atualização (electron/main/updater.ts)
      - name: Versão
        shell: bash
        working-directory: apps/desktop
        run: npm pkg set version="$APP_VERSION"
      # versão em que cada novidade entrou (tags de release); as que ainda não estão em tag entram nesta
      - name: Versão nas novidades
        shell: bash
        run: node apps/desktop/scripts/changelog-versions.mjs --current "$APP_VERSION"
      # Dependências pelo turbo; o app fora dele, porque o turbo não repassa VITE_OPENCORD_SERVER_URL ao vite.
      - run: pnpm turbo run build --filter "@opencord/desktop^..."
      - run: pnpm --filter @opencord/desktop build
      - run: pnpm --filter @opencord/desktop test
      - name: Empacotar
        working-directory: apps/desktop
        run: npx --yes electron-builder@26.17.0 ${{ matrix.flag }} --config electron-builder.yml --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencord-${{ matrix.name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14

  # Windows pelo app em Tauri (ADR-0062): interface do apps/desktop no WebView2, núcleo em Rust, live nativa (oc-live)
  windows-tauri:
    needs: version
    if: vars.TAURI_WINDOWS == '1' || inputs.tauri
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VITE_OPENCORD_SERVER_URL: ${{ inputs.server_url || vars.OPENCORD_SERVER_URL || 'https://api.opencord.pro' }}
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versão nas novidades
        shell: bash
        run: node apps/desktop/scripts/changelog-versions.mjs --current "$APP_VERSION"
      - run: pnpm turbo run build --filter "@opencord/desktop-tauri^..."
      - run: pnpm --filter @opencord/desktop test
      # Rust do runner (rustup estável, alvo msvc) e o csc do .NET Framework para o oc-audio/oc-input
      - name: Empacotar (Tauri, NSIS)
        shell: bash
        run: node apps/desktop-tauri/scripts/build-ci.mjs "$APP_VERSION" out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencord-windows
          path: out/*.exe
          if-no-files-found: error
          retention-days: 14

  # Entrega no volume de downloads da API (docs/DEPLOYMENT.md → "Entrega automática"). Só roda se todos os
  # instaladores foram gerados e o secret existe; a API passa a servir a versão nova sem redeploy.
  publish:
    needs: [version, package, windows-tauri]
    # o windows-tauri fica de fora (skipped) sem TAURI_WINDOWS; com ele, precisa ter dado certo
    if: >-
      !cancelled() && needs.package.result == 'success' &&
      (needs.windows-tauri.result == 'success' || needs.windows-tauri.result == 'skipped') &&
      (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    concurrency: desktop-publish
    permissions:
      contents: write
    env:
      SSH_KEY: ${{ secrets.DOWNLOADS_SSH_KEY }}
      SSH_HOST: ${{ secrets.DOWNLOADS_SSH_HOST }}
      SSH_USER: ${{ secrets.DOWNLOADS_SSH_USER }}
      SSH_KNOWN_HOSTS: ${{ secrets.DOWNLOADS_SSH_KNOWN_HOSTS }}
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Sem secret de entrega
        if: env.SSH_KEY == ''
        run: echo "::notice::DOWNLOADS_SSH_KEY não configurado; instaladores ficam só como artefatos do run."
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # novidades da versão: o app instalado mostra a lista antes de atualizar (GET /downloads/desktop/notes);
      # histórico completo para as notas da release (changelog desde a release anterior)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: repo
          sparse-checkout: apps/desktop
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Novidades da versão
        run: node repo/apps/desktop/scripts/release-notes.mjs "dist/OpenCord-notes-$APP_VERSION.json"
      - name: Release no GitHub (instaladores + novidades desde a release anterior)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName -q '.[0].tagName' || true)
          node repo/apps/desktop/scripts/release-notes.mjs --markdown --repo repo --to "$GITHUB_SHA" ${prev:+--from "$prev"} > notes.md
          cat notes.md
          gh release create "v$APP_VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "OpenCord $APP_VERSION" --notes-file notes.md \
            dist/*.exe dist/*.dmg dist/*.AppImage dist/*.deb
          echo "Release v$APP_VERSION criada" >> "$GITHUB_STEP_SUMMARY"
      - name: Enviar por SSH (rrsync só-escrita)
        if: env.SSH_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_downloads && chmod 600 ~/.ssh/id_downloads
          # host fixado: sem known_hosts certo não envia (evita entregar instaladores a um servidor trocado)
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ls -la dist
          # destino relativo à pasta fixada pelo rrsync no servidor; o rsync grava em arquivo temporário oculto e
          # renomeia no fim, então a API nunca serve um instalador pela metade
          # --omit-dir-times: a pasta do volume é do root; o usuário só grava arquivos (não muda a data da pasta)
          rsync -rt --omit-dir-times --chmod=F644 -e "ssh -i ~/.ssh/id_downloads -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            dist/ "$SSH_USER@$SSH_HOST:"
          echo "Publicado $APP_VERSION em $SSH_HOST" >> "$GITHUB_STEP_SUMMARY"
