<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      CSP: sem scripts inline/eval. connect/img/media liberados para http(s)/ws(s) porque o servidor é
      escolhido pelo usuário (self-hosted); a autenticação é por Bearer, não por cookie.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' blob: mediastream: http: https:; connect-src 'self' blob: data: http: https: ws: wss:; font-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <link rel="icon" type="image/png" href="/src/assets/favicon.png" />
    <!-- instalável no celular (PWA, ADR-0035); o Electron ignora o manifesto e nunca registra o service worker -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d0e11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OpenCord" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>OpenCord</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
